name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: receivy
          POSTGRES_PASSWORD: receivy
          POSTGRES_DB: receivy
        ports:
          - 55434:5432
        options: >-
          --health-cmd "pg_isready -U receivy -d receivy"
          --health-interval 1s
          --health-timeout 2s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.3 --activate

      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace
        run: pnpm verify

      - name: Verify financial PostgreSQL integration
        run: pnpm --filter @receivy/api check-types:test && pnpm --filter @receivy/api test:integration

      - name: Smoke-test financial HTTP transport
        run: pnpm --filter @receivy/api test:http-smoke

      - name: Build web container
        run: docker build -f packages/web/Dockerfile -t receivy-web:ci .
