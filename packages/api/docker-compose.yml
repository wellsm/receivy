name: receivy-api

services:
  postgres:
    image: postgres:16-alpine
    container_name: receivy-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: receivy
      POSTGRES_PASSWORD: receivy
      POSTGRES_DB: receivy
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - receivy_pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receivy -d receivy"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.31
    container_name: receivy-mailpit
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      # Web UI and REST API used by EMAIL_TRANSPORT=mailpit.
      - "127.0.0.1:8025:8025"
      # SMTP, kept for tools that cannot use the HTTP API.
      - "127.0.0.1:1025:1025"
    volumes:
      - receivy_mailpit_data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 5

  whap:
    image: receivy-whap:latest
    pull_policy: never
    build:
      context: https://github.com/fdarian/whap.git#068442323d9f53a529fcf01dbc6b70c597c17352
    container_name: receivy-whap
    restart: unless-stopped
    environment:
      WEBHOOK_URL: http://host.docker.internal:3735/local-receivy-api/webhooks/whatsapp/meta
      WEBHOOK_SECRET: whatsapp_app_secret_local
    ports:
      # 3011 on the host so this can run next to another project's whap on 3010.
      - "127.0.0.1:3011:3010"
    volumes:
      - ./whap/templates:/app/templates:ro

  redis:
    image: redis:7-alpine
    container_name: receivy-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"

  evolution:
    image: evoapicloud/evolution-api:v2.3.0
    container_name: receivy-evolution
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SERVER_URL: http://127.0.0.1:8080
      AUTHENTICATION_API_KEY: evolution_local_key
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://receivy:receivy@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: receivy_evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: receivy
      WEBHOOK_GLOBAL_ENABLED: "false"
      QRCODE_LIMIT: "30"
      LOG_LEVEL: ERROR,WARN
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - receivy_evolution_instances:/evolution/instances

volumes:
  receivy_pg_data:
  receivy_mailpit_data:
  receivy_evolution_instances:
