<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E5547"/>
      <stop offset="0.55" stop-color="#274639"/>
      <stop offset="1" stop-color="#1F3A33"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0B1F19" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g fill="none" stroke="#D6E5E6" stroke-width="112" filter="url(#shadow)" transform="translate(8 -2)">
    <!-- stem + top bar: square corner, flat stem end -->
    <path stroke-linejoin="miter" stroke-linecap="butt" d="M 348 380 L 348 303 L 620 303"/>
    <!-- bowl curve flowing into the arrow shaft and head -->
    <path stroke-linejoin="round" stroke-linecap="round" d="
      M 620 303
      A 127 127 0 0 1 620 557
      L 262 557
      M 365 470
      L 262 557
      L 365 645"/>
    <!-- straight leg from the junction -->
    <path stroke-linecap="round" d="M 585 557 L 745 740"/>
  </g>
</svg>
