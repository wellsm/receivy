appId: dev.receivy.local
---
# The code field is focused automatically; typing fills the six boxes.
- inputText: ${CODE}
- tapOn: "Digite o código de 6 dígitos"
- tapOn: "Confirmar e Entrar"
- extendedWaitUntil:
    visible: "Como podemos chamar você?"
    timeout: 20000
- tapOn:
    text: "Nome"
    index: 1
- inputText: "QA Smoke"
- tapOn: "Como podemos chamar você?"
- tapOn: "Continuar"
- runFlow:
    when:
      visible: "Como podemos chamar você?"
    commands:
      - tapOn: "Continuar"
- extendedWaitUntil:
    visible: "A RECEBER"
    timeout: 20000
- assertVisible: "Sua timeline começa aqui"
