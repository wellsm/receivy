# Perfil -> Pix key -> contact -> Cobranças -> charge -> share -> feed totals.
# Labels and inputs share the same string, so those inputs are addressed by
# index 1. Tapping a section title dismisses the keyboard (the form's ScrollView
# uses keyboardShouldPersistTaps="handled"), which keeps the fixed footer
# reachable. Sub-screens now run under the native stack header, so "back" is a
# tap on the previous screen's title in the header ("Perfil", "Cobranças").
# A fresh account has no Pix key and the billing form would bounce to the key
# screen, so the key is registered first — the e-mail type is the default and
# the field already carries the account e-mail. Both platforms open a native
# share sheet on publish and need dismissing before the charge-detail
# assertions: Android shows "Sharing link" and closes on the hardware Back key;
# iOS shows its own sheet, dismissed by tapping the "dismiss popup" backdrop.
appId: dev.receivy.local
---
- tapOn: "Perfil"
- extendedWaitUntil:
    visible: "Gerenciar contatos"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Gerenciar chaves Pix"
    direction: DOWN
- tapOn: "Gerenciar chaves Pix"
- extendedWaitUntil:
    visible: "Suas chaves Pix"
    timeout: 15000
- assertVisible: ${EMAIL}
- tapOn: "Salvar chave"
- extendedWaitUntil:
    visible: "Chaves Pix atualizadas."
    timeout: 15000
- tapOn: "Perfil"
- extendedWaitUntil:
    visible: "Gerenciar contatos"
    timeout: 15000
- tapOn: "Gerenciar contatos"
- extendedWaitUntil:
    visible: "Quem faz parte das suas contas?"
    timeout: 15000
- tapOn:
    text: "Nome"
    index: 1
- inputText: "Ana QA"
- tapOn: "E-mail do contato"
- inputText: "ana-qa@example.invalid"
- tapOn: "Salvar contato"
- extendedWaitUntil:
    visible: "Contato salvo."
    timeout: 15000
- tapOn: "Perfil"
- extendedWaitUntil:
    visible: "Gerenciar contatos"
    timeout: 15000
- tapOn: "Cobranças"
- extendedWaitUntil:
    visible: "Nova cobrança"
    timeout: 15000
- tapOn: "Nova cobrança"
- extendedWaitUntil:
    visible: "Para quem?"
    timeout: 15000
- tapOn: "Ana QA"
- tapOn: "Valor"
- inputText: "10000"
- tapOn: "Para quem?"
- assertVisible: "100,00"
- scrollUntilVisible:
    element:
      text: "Título"
    direction: DOWN
- tapOn:
    text: "Título"
    index: 1
- inputText: "Mercado QA"
- scrollUntilVisible:
    element:
      text: "Para quem?"
    direction: UP
- tapOn: "Para quem?"
- scrollUntilVisible:
    element:
      text: "Criar cobrança"
    direction: DOWN
- tapOn: "Criar cobrança"
- extendedWaitUntil:
    visible: "Cobrança criada"
    timeout: 20000
- tapOn: "Ver cobrança"
- extendedWaitUntil:
    visible: "Compartilhar cobrança"
    timeout: 20000
- tapOn: "Compartilhar cobrança"
- runFlow:
    when:
      visible: "Sharing link"
    commands:
      - pressKey: Back
- runFlow:
    when:
      visible: "dismiss popup"
    commands:
      - tapOn: "dismiss popup"
- extendedWaitUntil:
    visible: "Compartilhar cobrança"
    timeout: 20000
- tapOn: "Cobranças"
- extendedWaitUntil:
    visible: "Nova cobrança"
    timeout: 15000
- tapOn: "Feed"
- extendedWaitUntil:
    visible: 'R\$.50,00'
    timeout: 20000
- assertVisible: "1 pendência"
- scrollUntilVisible:
    element:
      text: "Abrir cobrança Mercado QA"
    direction: DOWN
