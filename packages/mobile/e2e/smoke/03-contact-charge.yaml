# Perfil -> contact -> Cobranças -> charge -> inline Pix -> public link -> feed totals.
# Labels and inputs share the same string, so inputs are addressed by index 1
# or by placeholder. Both platforms open a native share sheet on publish and
# need dismissing before the charge-detail assertions: Android shows
# "Sharing link" and closes on the hardware Back key; iOS shows its own
# sheet, dismissed by tapping the "dismiss popup" backdrop element.
appId: dev.receivy.local
---
- tapOn: "Perfil"
- extendedWaitUntil:
    visible: "Gerenciar contatos"
    timeout: 15000
- tapOn: "Gerenciar contatos"
- extendedWaitUntil:
    visible: "Quem faz parte das suas contas?"
    timeout: 15000
- tapOn:
    text: "Nome"
    index: 1
- inputText: "Ana QA"
- tapOn: "E-mail do contato"
- inputText: "ana-qa@example.invalid"
- tapOn: "Salvar contato"
- extendedWaitUntil:
    visible: "Contato salvo."
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "← Perfil"
    direction: UP
- tapOn: "← Perfil"
- extendedWaitUntil:
    visible: "Gerenciar contatos"
    timeout: 15000
- tapOn: "Feed"
- extendedWaitUntil:
    visible: "A RECEBER"
    timeout: 15000
- tapOn: "Cobranças"
- extendedWaitUntil:
    visible: "Nova cobrança"
    timeout: 15000
- tapOn: "Nova cobrança"
- extendedWaitUntil:
    visible: "Divida com clareza antes de cobrar."
    timeout: 15000
- tapOn: "Uma vez"
- tapOn: "Ana QA"
- scrollUntilVisible:
    element:
      text: "Valor de cada cobrança"
    direction: DOWN
- tapOn:
    text: "Valor de cada cobrança"
    index: 1
- inputText: "100,00"
- scrollUntilVisible:
    element:
      text: "Divida com clareza antes de cobrar."
    direction: UP
- tapOn: "Divida com clareza antes de cobrar."
- scrollUntilVisible:
    element:
      text: "Descrição"
    direction: DOWN
- tapOn:
    text: "Descrição"
    index: 1
- inputText: "Mercado QA"
- scrollUntilVisible:
    element:
      text: "Divida com clareza antes de cobrar."
    direction: UP
- tapOn: "Divida com clareza antes de cobrar."
- scrollUntilVisible:
    element:
      text: "Revisar cobrança"
    direction: DOWN
- tapOn: "Revisar cobrança"
- scrollUntilVisible:
    element:
      text: "Criar cobrança"
    direction: DOWN
- tapOn: "Criar cobrança"
- extendedWaitUntil:
    visible: "Pix antes de compartilhar"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Nova chave Pix"
    direction: DOWN
- tapOn: "Nova chave Pix"
- inputText: ${EMAIL}
- tapOn: "Cadastrar uma chave Pix"
- scrollUntilVisible:
    element:
      text: "Salvar nova chave"
    direction: DOWN
- tapOn: "Salvar nova chave"
- extendedWaitUntil:
    visible: "Publicar com este Pix"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Publicar com este Pix"
    direction: UP
- tapOn: "Publicar com este Pix"
- runFlow:
    when:
      visible: "Sharing link"
    commands:
      - pressKey: Back
- runFlow:
    when:
      visible: "dismiss popup"
    commands:
      - tapOn: "dismiss popup"
- extendedWaitUntil:
    visible: "Compartilhar cobrança"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Voltar para o feed"
    direction: UP
- tapOn: "Voltar para o feed"
- extendedWaitUntil:
    visible: 'R\$.50,00'
    timeout: 20000
- assertVisible: "1 pendência"
- scrollUntilVisible:
    element:
      text: "Abrir cobrança Mercado QA"
    direction: DOWN
