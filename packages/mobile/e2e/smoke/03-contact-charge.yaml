# Perfil -> payment method -> contact -> Contas -> charge -> share -> feed totals.
# Labels and inputs share the same string, so those inputs are addressed by
# index 1. Tapping a section title dismisses the keyboard (the form's ScrollView
# uses keyboardShouldPersistTaps="handled"), which keeps the fixed footer
# reachable. Sub-screens now run under the native stack header, so "back" is a
# tap on the previous screen's title in the header ("Perfil", "Contas").
# Methods and contacts are registered on their own screens, reached from the FABs
# of their lists; a save pops back to the list, so the list's own FAB label
# ("Cadastrar novo meio" — the FAB's accessibilityLabel, lowercase, which is what
# Maestro matches on iOS since the accessibilityLabel hides the child <Text>)
# and the new row are what prove the return trip.
# A fresh account has no payment method and the billing form would bounce to the
# method screen, so the method is registered first — the e-mail Pix key type is
# the default and the field already carries the account e-mail. Both platforms open a native
# share sheet on publish and need dismissing before the charge-detail
# assertions: Android shows "Sharing link" and closes on the hardware Back key;
# iOS shows its own sheet, dismissed by tapping the "dismiss popup" backdrop.
appId: dev.receivy.local
---
- tapOn: "Perfil"
- extendedWaitUntil:
    visible: "Gerenciar contatos"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Gerenciar meios de pagamento"
    direction: DOWN
- tapOn: "Gerenciar meios de pagamento"
- extendedWaitUntil:
    visible: "Cadastrar novo meio"
    timeout: 15000
- tapOn: "Cadastrar novo meio"
- extendedWaitUntil:
    visible: "Salvar meio de pagamento"
    timeout: 15000
- tapOn: "E-mail"
- assertVisible: ${EMAIL}
- tapOn: "Salvar meio de pagamento"
- extendedWaitUntil:
    visible: "Cadastrar novo meio"
    timeout: 15000
- assertVisible: ${EMAIL}
- tapOn: "Perfil"
- extendedWaitUntil:
    visible: "Gerenciar contatos"
    timeout: 15000
- tapOn: "Gerenciar contatos"
- extendedWaitUntil:
    visible: "Novo contato"
    timeout: 15000
- tapOn: "Novo contato"
- extendedWaitUntil:
    visible: "Salvar contato"
    timeout: 15000
- tapOn:
    text: "Nome completo"
    index: 1
- inputText: "Ana QA"
# The keyboard covers the lower fields; tapping the intro text dismisses it and
# the scroll brings the e-mail field into view before it is focused. The form has
# no phone field any more: the person fills their own number at onboarding.
- tapOn: "Adicione pessoas para dividir despesas e lembrar pagamentos sem constrangimento."
- scrollUntilVisible:
    element:
      text: "Sem e-mail, a pessoa só recebe pelo link compartilhado. Quando ela entrar por um convite, você confirma quem é."
    direction: DOWN
- tapOn:
    text: "E-mail (opcional)"
    index: 1
- inputText: "ana-qa@example.invalid"
- tapOn: "Adicione pessoas para dividir despesas e lembrar pagamentos sem constrangimento."
- tapOn: "Salvar contato"
- extendedWaitUntil:
    visible: "Contato Ana QA"
    timeout: 15000
- tapOn: "Perfil"
- extendedWaitUntil:
    visible: "Gerenciar contatos"
    timeout: 15000
- tapOn: "Contas"
- extendedWaitUntil:
    visible: "Nova conta"
    timeout: 15000
- tapOn: "Nova conta"
- extendedWaitUntil:
    visible: "Participantes"
    timeout: 15000
- tapOn: "Adicionar"
- extendedWaitUntil:
    visible: "Ana QA"
    timeout: 15000
- tapOn: "Ana QA"
- tapOn: "Concluir"
- tapOn: "Valor"
- inputText: "10000"
- tapOn: "Participantes"
- assertVisible: "100,00"
- scrollUntilVisible:
    element:
      text: "Título da conta"
    direction: DOWN
- tapOn: "Título"
- inputText: "Mercado QA"
- scrollUntilVisible:
    element:
      text: "Participantes"
    direction: UP
- tapOn: "Participantes"
- scrollUntilVisible:
    element:
      text: "Criar conta"
    direction: DOWN
- tapOn: "Criar conta"
- extendedWaitUntil:
    visible: "Detalhes da conta"
    timeout: 20000
- tapOn: "Ana QA"
- extendedWaitUntil:
    visible: "Compartilhar"
    timeout: 20000
- tapOn: "Compartilhar"
- runFlow:
    when:
      visible: "Sharing link"
    commands:
      - pressKey: Back
- runFlow:
    when:
      visible: "dismiss popup"
    commands:
      - tapOn: "dismiss popup"
- extendedWaitUntil:
    visible: "Compartilhar"
    timeout: 20000
- tapOn: "Contas"
- extendedWaitUntil:
    visible: "Nova conta"
    timeout: 15000
- tapOn: "Feed"
- extendedWaitUntil:
    visible: 'R\$.50,00'
    timeout: 20000
- assertVisible: "1 pendência"
- scrollUntilVisible:
    element:
      text: "Abrir cobrança Mercado QA"
    direction: DOWN
