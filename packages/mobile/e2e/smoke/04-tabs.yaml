appId: dev.receivy.local
---
- tapOn: "Perfil"
- extendedWaitUntil:
    visible: "Sua conta"
    timeout: 15000
- assertVisible: "Sessões e dispositivos"
- scrollUntilVisible:
    element:
      text: "Exportar dados"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Excluir conta"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Chaves Pix"
    direction: UP
- tapOn: "Gerenciar chaves Pix"
- extendedWaitUntil:
    visible: "Suas chaves Pix"
    timeout: 15000
- assertVisible: ${EMAIL}
- tapOn: "← Perfil"
- extendedWaitUntil:
    visible: "← Feed"
    timeout: 15000
- tapOn: "← Feed"
- extendedWaitUntil:
    visible: "Cobranças"
    timeout: 15000
- tapOn: "Cobranças"
- extendedWaitUntil:
    visible: "Nova cobrança"
    timeout: 15000
- tapOn: "Feed"
- extendedWaitUntil:
    visible: "A RECEBER"
    timeout: 15000
