appId: dev.receivy.local
---
- tapOn: "Perfil"
- extendedWaitUntil:
    visible: "Gerenciar contatos"
    timeout: 15000
- assertVisible: "Sair da conta"
- scrollUntilVisible:
    element:
      text: "Excluir conta"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Gerenciar meios de pagamento"
    direction: UP
- tapOn: "Gerenciar meios de pagamento"
- extendedWaitUntil:
    visible: "Cadastrar novo meio"
    timeout: 15000
- assertVisible: ${EMAIL}
# The payment methods screen runs under the native stack header: its back button
# carries the previous screen's title, so "Perfil" is the way back.
- tapOn: "Perfil"
- extendedWaitUntil:
    visible: "Gerenciar contatos"
    timeout: 15000
- tapOn: "Contas"
- extendedWaitUntil:
    visible: "Nova conta"
    timeout: 15000
- tapOn: "Feed"
- extendedWaitUntil:
    visible: "A RECEBER"
    timeout: 15000
