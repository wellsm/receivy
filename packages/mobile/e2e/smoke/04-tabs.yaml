appId: dev.receivy.local
---
- tapOn: "Perfil"
- extendedWaitUntil:
    visible: "Gerenciar contatos"
    timeout: 15000
- assertVisible: "Sair da conta"
- scrollUntilVisible:
    element:
      text: "Excluir conta"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Gerenciar chaves Pix"
    direction: UP
- tapOn: "Gerenciar chaves Pix"
- extendedWaitUntil:
    visible: "Suas chaves Pix"
    timeout: 15000
- assertVisible: ${EMAIL}
- tapOn: "← Perfil"
- extendedWaitUntil:
    visible: "Gerenciar contatos"
    timeout: 15000
- tapOn: "Cobranças"
- extendedWaitUntil:
    visible: "Nova cobrança"
    timeout: 15000
- tapOn: "Feed"
- extendedWaitUntil:
    visible: "A RECEBER"
    timeout: 15000
