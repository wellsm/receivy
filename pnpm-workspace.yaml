# @ez4/aws-cloudfront, rebuilt on the 0.53.0 tag with two changes; the source diff against
# upstream is vendor/ez4-aws-cloudfront-0.53.0-cdn-output.patch:
# 1. prints the distribution URL (and aliases) after deploy / `ez4 output` via
#    `deploy:resourceOutput`, labelled with the service's `@description` (the generated
#    distribution name when there is none). Source: branch feat/cdn-resource-output in
#    ~/Projects/ez4 (worktree ~/Projects/ez4-cdn-output).
# 2. `ez4 destroy` works for a distribution with a rewrite rule or a certificate: the
#    request that disables the distribution before deleting it keeps the function and
#    certificate ARNs. Upstream omits them and CloudFront rejects the request.
# pnpm trusts the hash in the lockfile and never re-reads a tarball under the same name: a
# rebuilt tarball gets a new suffix (-2, -3, ...). Remove the entry once upstream ships both.
overrides:
  "@ez4/aws-cloudfront": "file:./vendor/ez4-aws-cloudfront-0.53.0-cdn-output-3.tgz"
  "@ez4/aws-common": "file:./vendor/ez4-aws-common-0.53.0.tgz"
  "@ez4/raw-pg": "file:./vendor/ez4-raw-pg-0.53.0.tgz"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

