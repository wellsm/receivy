# EZ4 providers built from ~/Projects/ez4 (0.55.0 plus changes not published yet); the recipe and
# what each one changes are in docs/ez4-vendor-patches.md, the source diffs in vendor/*.patch.
# - @ez4/aws-cloudfront: prints the site URL after deploy / `ez4 output`, and `ez4 destroy` works
#   for a distribution with a rewrite rule or a certificate.
# - @ez4/aws-certificate: ACM is always addressed in us-east-1, the only region CloudFront accepts
#   certificates from; the deploy itself stays in sa-east-1, where the EZ4 state bucket lives.
# - @ez4/reflection: accepts a class merged with an interface of the same name. 0.55 reads types
#   without the DOM library, so `URL` and `URLSearchParams` come from @types/node, where they are
#   both; upstream stops with "Source identity 'URLSearchParams' has a naming collision".
# pnpm trusts the hash in the lockfile and never re-reads a tarball under the same name: a
# rebuilt tarball gets a new suffix (-2, -3, ...). Remove an entry once upstream ships the change.
overrides:
  "@ez4/aws-certificate": "file:./vendor/ez4-aws-certificate-0.55.0-us-east-1.tgz"
  "@ez4/aws-cloudfront": "file:./vendor/ez4-aws-cloudfront-0.55.0-cdn-output.tgz"
  "@ez4/reflection": "file:./vendor/ez4-reflection-0.55.0-class-merging.tgz"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

